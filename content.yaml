# =============================================================================
#  content.yaml  —  YOUR WEBSITE CONTENT
#
#  HOW TO USE:
#    1. Edit anything in this file
#    2. Run:  python build.py
#    3. Upload the new index.html to GitHub
#
#  TIPS:
#    - Wrap your name in **double stars** to bold it in author lists
#    - Leave pdf: "" blank if you have no PDF for a paper
#    - To add a paper PDF: put the file in a "papers/" folder in your GitHub
#      repo, then set  pdf: "papers/your_file.pdf"
#    - Add a new publication by copying any block under publications > items
#      IDs (J1, J2, C1...) are assigned automatically — no need to set them!
#      Just set the year: and drop entries in any order; build.py will sort.
#    - Add a new experience by copying any block under experience > items
# =============================================================================


# ── SITE META ─────────────────────────────────────────────────────────────────
site:
  title: "Arindam Sikdar — Computer Vision Researcher"
  author: "Arindam Sikdar"


# ── HERO (top of page) ────────────────────────────────────────────────────────
# photo: upload your headshot to GitHub as images/profile.jpg to display it.
#        Keep all diagrams and photos in the images/ folder alongside profile.jpg.
# cv:    CV is served from CV_Arindam_Sikdar.pdf in the root of the repo.
hero:
  first_name: "Arindam"
  last_name: "Sikdar"
  photo: "images/profile.jpg"
  cv: "CV_Arindam_Sikdar.pdf"

  # Research keyword pills shown between biography and links
  topics:
    - "Graph Learning"
    - "Vision-Language Models"
    - "Multimodal AI"

  # Compact academic biography paragraph.
  # Supports inline markup: **bold**, *italic*, [link text](url)
  research_statement: >-
    I am a researcher in **Computer Vision and Artificial Intelligence**, focusing
    on **data-efficient and structured visual learning** for robust real-world
    perception. Previously, I was a Postdoctoral Research Associate at
    **Edge Hill University**, working on the UKRI/EPSRC-funded
    [ATRACT project](https://gtr.ukri.org/projects?ref=EP%2FX028631%2F1), and at
    the **University of Bristol**, where I contributed to the EPSRC-funded
    [SPHERE programme](https://gtr.ukri.org/projects?ref=EP%2FR005273%2F1) on
    vision-based health monitoring. I received my Ph.D. from **Jadavpur University**.
    My research has appeared in venues including *IJCV*,
    *IEEE Transactions on Artificial Intelligence*,
    *Artificial Intelligence in Medicine*, *Scientific Data*, and *ICIP*.

  # Compact highlights shown beneath the portrait (2–3 items)
  highlights:
    - num: "15+"
      label: "Peer-reviewed publications"
    - num: "2×"
      label: "EPSRC-funded postdoc"

  # Link styles: cv (navy filled) | scholar (blue outlined) | outline (light)
  # icon options: cv | scholar | github | orcid | linkedin | email
  links:
    - label: "CV"
      url: "CV_Arindam_Sikdar.pdf"
      style: "cv"
      icon: "cv"

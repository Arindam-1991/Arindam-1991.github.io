# ── ABOUT — Research Interests ────────────────────────────────────────────────
about:
  cards:
    - icon: "👁"
      title: "Computer Vision & Pattern Recognition"
      text: >-
        Developing interpretable, efficient, and scalable visual intelligence systems
        with emphasis on person re-identification, fine-grained visual recognition,
        and crowd analysis.

    - icon: "🤖"
      title: "Deep Learning & Multimodal AI"
      text: >-
        Designing novel deep learning architectures for high-order feature interactions,
        multimodal fusion, and real-time inference in autonomous and intelligent systems.

    - icon: "🚨"
      title: "Visual Anomaly Detection"
      text: >-
        Building training-less and adaptive frameworks for anomaly detection in crowd
        scenes and surveillance environments using lightweight, resource-efficient methods.

    - icon: "🏥"
      title: "Smart Healthcare Applications"
      text: >-
        Leveraging vision-based sensing for unobtrusive symptom monitoring — including
        Parkinson's disease assessment and infant pulse rate estimation — to enable
        remote clinical care.

    - icon: "🛸"
      title: "Autonomous Systems & Robotics"
      text: >-
        Integrating trustworthy AI principles into drone-based triage systems,
        UAV-guided navigation, and traffic scene analysis for safety-critical
        real-world deployments.

    - icon: "🔬"
      title: "Human Activity Recognition"
      text: >-
        Developing pose-estimation and motion analysis techniques for gesture-based
        interaction, activity classification, and mobility assessment in naturalistic
        environments.


# ── EXPERIENCE ────────────────────────────────────────────────────────────────
# To add a new position: copy one block (years through tag) and fill it in.
experience:
  items:
    - years: "2023 – 2026"
      title: "Postdoctoral Research Associate"
      institution: "Edge Hill University, Lancashire, UK · EPSRC/UKRI"
      description: >-
        Leading design and development of a drone-based autonomous triage system
        for high-risk environments (ATRACT project). Focuses on multimodal AI,
        real-time vital sign estimation, and injury severity prediction under MoD
        and WHO-aligned trustworthy AI frameworks.
      tag: "EPSRC Funded · ATRACT Project"

    - years: "2022 – 2023"
      title: "Postdoctoral Research Associate"
      institution: "University of Bristol, UK · EPSRC/UKRI"
      description: >-
        Led vision-based research for the SPHERE-A smart home sensing platform for
        chronic health monitoring. Developed a deep learning pipeline for estimating
        turning angles from monocular in-home videos using 3D pose estimation for
        Parkinson's disease assessment.
      tag: "EPSRC Funded · SPHERE-A Project"

    - years: "2021"
      title: "AI / Machine Learning Engineer"
      institution: "National Informatics Centre (NIC), MeitY, India"
      description: >-
        Developed a face-recognition-based attendance monitoring system for the
        Utkarsh Bang initiative. Contributed to AI frameworks for road inspection,
        traffic congestion analysis, and helmetless two-wheeler detection using
        deep learning.
      tag: "Government of India"

    - years: "2020"
      title: "Research Engineer — UAV Guided Helicopter Landing"
      institution: "ELMAX Systems and Solutions · Jadavpur University, India"
      description: >-
        Built a vision-guided navigation framework to autonomously identify safe
        landing zones for helicopters in dynamic environments, in collaboration
        with an industry partner.
      tag: "Industry Collaboration"

    - years: "2015 – 2021"
      title: "PhD — Computer Vision-Based Video Surveillance"
      institution: "Jadavpur University, Kolkata, India · CGPA: 9.5/10"
      description: >-
        Thesis: On Some Problems in Computer Vision Based Video Surveillance.
        Proposed lightweight, training-less methods for real-time anomaly detection,
        crowd behaviour analysis, and person re-identification suited for
        resource-constrained environments. Supervised by Prof. Ananda S. Chowdhury.
      tag: "Doctorate · First Class"

    - years: "2013 – 2015"
      title: "M.Tech — Electronics & Communication Engineering"
      institution: "IIT Bhubaneswar, Odisha, India · CGPA: 8.16/10"
      description: >-
        Thesis focused on developing a contactless vision-based method to estimate
        pulse rate in infants during neurological examinations, leveraging color
        signal analysis and dimensionality reduction. Supervised by Dr. Debi Prosad Dogra.
      tag: "IIT · First Class"


